    <div class="pagina">
        <div class="pagina__texto">
            <h1 class="pagina__titulo" data-titulo>Usuários</h1>
            <p class="pagina__sub">
                Quem entra no sistema, com que nome de acesso
                e até quando.
            </p>
        </div>

        <div class="pagina__acoes">
            <button class="botao botao--primario" type="button" data-abrir="usuario" data-pressionavel>
                <svg class="botao__icone" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mais"/></svg>

            </button>
        </div>
    </div>

            <button class="filtro" type="button" data-filtro="administradores">Administradores</button>
        </nav>

    <p class="contagem" data-contagem aria-live="polite"></p>

    <div data-lista="usuarios"></div>

    <!--

      manual entre o título e a primeira ação. Aqui embaixo é onde alguém olha
      depois de tentar excluir a própria conta e não conseguir.

    <p class="rodape-tela">
